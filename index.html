<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Ilha Blocky - Protótipo 3D</title>
    <style>
        /* ===== ESTILO PARA TELA CHEIA ===== */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;   /* remove barras de rolagem */
            width: 100%;
            height: 100%;
            background: #87CEEB; /* cor de céu de fallback */
            font-family: Arial, sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* ===== INSTRUÇÕES NA TELA ===== */
        #instrucoes {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            pointer-events: none;
            user-select: none;
            text-shadow: 1px 1px 2px #000;
        }
        #instrucoes b { color: #ffd966; }
        /* ===== CROSSHAIR SIMPLES (opcional) ===== */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Instruções de controle exibidas ao jogador -->
    <div id="instrucoes">
        <b>WASD</b> mover &nbsp;|&nbsp; <b>Espaço</b> pular<br />
        <b>Mouse</b> orbitar câmera &nbsp;|&nbsp; <b>Clique Esq.</b> disparar poder<br />
        <i>Clique na tela para travar o mouse</i>
    </div>
    <div id="crosshair"></div>

    <!-- ============================================================
         IMPORTAÇÃO DO THREE.JS VIA CDN (módulo ES)
         Utilizamos importmap para permitir o uso de "import ... from 'three'"
         ============================================================ -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    /* =====================================================================
       IMPORTAÇÕES
       ===================================================================== */
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // Nota: Não usaremos OrbitControls diretamente para o jogador, mas ele
    // ajuda a entender o padrão. A câmera do jogador é customizada abaixo.

    /* =====================================================================
       1. CONFIGURAÇÃO DO RENDERER, CENA E CÂMERA
       ===================================================================== */
    const canvas = document.createElement('canvas');
    canvas.id = 'game-canvas';
    document.body.appendChild(canvas);

    // Renderer com Anti-Aliasing e sombras
    const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;                       // sombras dinâmicas
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;        // sombras suaves
    renderer.outputColorSpace = THREE.SRGBColorSpace;        // cores corretas

    // Cena principal
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);            // céu azul
    scene.fog = new THREE.Fog(0x87CEEB, 60, 220);            // névoa ao longe

    // Câmera em perspectiva (terceira pessoa)
    const camera = new THREE.PerspectiveCamera(
        65,                                     // FOV
        window.innerWidth / window.innerHeight, // aspect
        0.1,                                    // near
        500                                     // far
    );
    camera.position.set(0, 8, 12);

    /* =====================================================================
       2. ILUMINAÇÃO (AmbientLight + DirectionalLight simulando sol)
       ===================================================================== */
    // Luz ambiente suave para preencher sombras
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambientLight);

    // Luz direcional (sol) com sombras
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
    sunLight.position.set(40, 60, 25);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -80;
    sunLight.shadow.camera.right = 80;
    sunLight.shadow.camera.top = 80;
    sunLight.shadow.camera.bottom = -80;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // Luz hemisférica extra para dar um tom de céu/terra (opcional, deixa mais bonito)
    const hemiLight = new THREE.HemisphereLight(0xbfe3ff, 0x3a5f3a, 0.35);
    scene.add(hemiLight);

    /* =====================================================================
       3. AMBIENTE: OCEANO E ILHA
       ===================================================================== */

    // ---------- 3.1 OCEANO (plano grande e azul) ----------
    const oceanGeometry = new THREE.PlaneGeometry(400, 400, 1, 1);
    const oceanMaterial = new THREE.MeshStandardMaterial({
        color: 0x1E90FF,
        transparent: true,
        opacity: 0.85,
        roughness: 0.2,
        metalness: 0.1
    });
    const ocean = new THREE.Mesh(oceanGeometry, oceanMaterial);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -0.6;                 // levemente abaixo do nível da ilha
    ocean.receiveShadow = true;
    scene.add(ocean);

    // ---------- 3.2 ILHA PRINCIPAL (base grande de "terra") ----------
    // [SUBSTITUIÇÃO FUTURA] Aqui você pode trocar esta caixa grande por um
    // modelo .glb de ilha feito no Blender. Basta fazer:
    //   const loader = new GLTFLoader();
    //   loader.load('ilha.glb', (gltf) => { scene.add(gltf.scene); });
    const ilhaGroup = new THREE.Group();
    scene.add(ilhaGroup);

    const materialTerra = new THREE.MeshStandardMaterial({ color: 0x6ab04c, roughness: 0.9 });
    const materialTerraEscura = new THREE.MeshStandardMaterial({ color: 0x4a8f3c, roughness: 0.9 });
    const materialAreia = new THREE.MeshStandardMaterial({ color: 0xE9D8A6, roughness: 1.0 });
    const materialPedra = new THREE.MeshStandardMaterial({ color: 0x8d8d8d, roughness: 0.8 });

    // Base principal (bloco grande de terra)
    const baseIlha = new THREE.Mesh(new THREE.BoxGeometry(60, 6, 60), materialTerra);
    baseIlha.position.set(0, -0.5, 0);
    baseIlha.receiveShadow = true;
    baseIlha.castShadow = true;
    ilhaGroup.add(baseIlha);

    // Faixa de areia ao redor da base (um pouco maior e mais baixa)
    const areia = new THREE.Mesh(new THREE.BoxGeometry(64, 1.5, 64), materialAreia);
    areia.position.set(0, -2.6, 0);
    areia.receiveShadow = true;
    areia.castShadow = true;
    ilhaGroup.add(areia);

    // ---------- 3.3 ELEVAÇÕES / TERRENO PROCEDURAL ----------
    // Colinas e plataformas em degraus (estilo blocky). Cada degrau é um
    // BoxGeometry posicionado em alturas diferentes. O jogador pode subir
    // neles por causa da colisão AABB simples implementada depois.
    const colinas = [
        // [x, y, z, largura, altura, profundidade]
        [ -14, 3,  -10, 14, 3, 14 ],
        [ -14, 6,  -10, 10, 3, 10 ],
        [  18, 3,   14, 12, 3, 12 ],
        [  18, 6,   14,  8, 3,  8 ],
        [   0, 3,   20, 10, 3,  8 ],
        [ -20, 3,   18,  8, 3, 10 ],
        [  22, 3,  -20, 10, 3, 10 ]
    ];
    const colinasMeshes = [];
    colinas.forEach(([x, y, z, w, h, d]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), materialTerraEscura);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        ilhaGroup.add(m);
        colinasMeshes.push(m);
    });

    // Alguns blocos de pedra espalhados (obstáculos)
    const pedrasMeshes = [];
    const posicoesPedras = [
        [ 8, 1.5, 8], [-6, 1.5, 6], [10, 1.5, -8],
        [-10, 1.5, -12], [4, 1.5, -16], [-18, 1.5, 0]
    ];
    posicoesPedras.forEach(([x, y, z]) => {
        const pedra = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), materialPedra);
        pedra.position.set(x, y, z);
        pedra.castShadow = true;
        pedra.receiveShadow = true;
        ilhaGroup.add(pedra);
        pedrasMeshes.push(pedra);
    });

    /* =====================================================================
       4. ÁRVORES DE BLOCOS (procedurais)
       [SUBSTITUIÇÃO FUTURA] Troque o grupo "arvore" por um modelo .glb
       ===================================================================== */
    const materialTronco = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 1 });
    const materialFolha = new THREE.MeshStandardMaterial({ color: 0x2E8B57, roughness: 0.9 });

    function criarArvore(x, z, escala = 1) {
        const arvore = new THREE.Group();

        const tronco = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5, 1.2), materialTronco);
        tronco.position.y = 2.5;
        tronco.castShadow = true;
        tronco.receiveShadow = true;
        arvore.add(tronco);

        // Copa feita de 3 cubos em degraus
        const copa1 = new THREE.Mesh(new THREE.BoxGeometry(4, 2.5, 4), materialFolha);
        copa1.position.y = 6;
        copa1.castShadow = true;
        copa1.receiveShadow = true;
        arvore.add(copa1);

        const copa2 = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 3), materialFolha);
        copa2.position.y = 8;
        copa2.castShadow = true;
        copa2.receiveShadow = true;
        arvore.add(copa2);

        const copa3 = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 2), materialFolha);
        copa3.position.y = 9.5;
        copa3.castShadow = true;
        copa3.receiveShadow = true;
        arvore.add(copa3);

        arvore.position.set(x, 2.5, z); // base do tronco no topo da ilha (y=2.5)
        arvore.scale.setScalar(escala);
        return arvore;
    }

    // Posições das árvores na ilha
    const posicoesArvores = [
        [-5, 5], [6, 3], [-8, -4], [12, 6], [-16, 8],
        [15, -12], [-12, 14], [20, 2], [-22, -6], [3, -20]
    ];
    posicoesArvores.forEach(([x, z]) => {
        const a = criarArvore(x, z, 0.9 + Math.random() * 0.4);
        ilhaGroup.add(a);
    });

    /* =====================================================================
       5. PERSONAGEM (AVATAR ESTILO ROBLOX)
       [SUBSTITUIÇÃO FUTURA] Importe um .glb/.gltf do seu personagem e
       substitua este grupo "player". Exemplo:
           const loader = new GLTFLoader();
           loader.load('personagem.glb', (gltf) => {
               player.remove(...player.children);
               player.add(gltf.scene);
           });
       ===================================================================== */
    const player = new THREE.Group();

    // Cabeça
    const cabecaGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
    const cabecaMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd });
    const cabeca = new THREE.Mesh(cabecaGeo, cabecaMat);
    cabeca.position.y = 3.3;
    cabeca.castShadow = true;
    cabeca.receiveShadow = true;
    player.add(cabeca);

    // Olhos (dois cubinhos pretos)
    const olhoGeo = new THREE.BoxGeometry(0.25, 0.25, 0.1);
    const olhoMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const olhoEsq = new THREE.Mesh(olhoGeo, olhoMat);
    olhoEsq.position.set(-0.35, 3.45, 0.82);
    player.add(olhoEsq);
    const olhoDir = olhoEsq.clone();
    olhoDir.position.x = 0.35;
    player.add(olhoDir);

    // Tronco
    const troncoGeo = new THREE.BoxGeometry(1.8, 2.2, 1.0);
    const troncoMat = new THREE.MeshStandardMaterial({ color: 0x2E86DE });
    const tronco = new THREE.Mesh(troncoGeo, troncoMat);
    tronco.position.y = 1.7;
    tronco.castShadow = true;
    tronco.receiveShadow = true;
    player.add(tronco);

    // Braços
    const bracoGeo = new THREE.BoxGeometry(0.6, 2.0, 0.7);
    const bracoMat = new THREE.MeshStandardMaterial({ color: 0xffe0bd });

    const bracoEsq = new THREE.Mesh(bracoGeo, bracoMat);
    bracoEsq.position.set(-1.25, 1.75, 0);
    bracoEsq.castShadow = true;
    bracoEsq.receiveShadow = true;
    player.add(bracoEsq);

    const bracoDir = bracoEsq.clone();
    bracoDir.position.x = 1.25;
    player.add(bracoDir);

    // Pernas
    const pernaGeo = new THREE.BoxGeometry(0.75, 1.6, 0.8);
    const pernaMat = new THREE.MeshStandardMaterial({ color: 0x2C3E50 });

    const pernaEsq = new THREE.Mesh(pernaGeo, pernaMat);
    pernaEsq.position.set(-0.5, -0.4, 0);
    pernaEsq.castShadow = true;
    pernaEsq.receiveShadow = true;
    player.add(pernaEsq);

    const pernaDir = pernaEsq.clone();
    pernaDir.position.x = 0.5;
    player.add(pernaDir);

    // O centro do player fica na base dos pés (y=0 do grupo = chão)
    player.position.set(0, 2.5, 0); // começa em cima da ilha
    scene.add(player);

    // ---------- Variáveis de física do jogador ----------
    const playerState = {
        velocity: new THREE.Vector3(0, 0, 0),
        onGround: false,
        speed: 9.0,
        jumpForce: 11.0,
        gravity: -28.0,
        radius: 0.9,           // "raio" aproximado para colisão
        height: 4.0            // altura total aproximada
    };

    /* =====================================================================
       6. CONTROLES: TECLADO E MOUSE (CÂMERA EM TERCEIRA PESSOA)
       ===================================================================== */
    const keys = { w: false, a: false, s: false, d: false, space: false };

    window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') keys.w = true;
        if (e.code === 'KeyA') keys.a = true;
        if (e.code === 'KeyS') keys.s = true;
        if (e.code === 'KeyD') keys.d = true;
        if (e.code === 'Space') { keys.space = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') keys.w = false;
        if (e.code === 'KeyA') keys.a = false;
        if (e.code === 'KeyS') keys.s = false;
        if (e.code === 'KeyD') keys.d = false;
        if (e.code === 'Space') keys.space = false;
    });

    // ----- Câmera orbital em terceira pessoa -----
    // A câmera gira em torno do jogador com base no movimento do mouse.
    // yaw = rotação horizontal, pitch = vertical.
    let cameraYaw = 0;       // em radianos
    let cameraPitch = 0.35;  // inclinação inicial (olhando levemente para baixo)
    const cameraDistance = 12;
    const mouseSensitivity = 0.0025;

    // Pointer Lock para capturar o mouse
    let pointerLocked = false;
    canvas.addEventListener('click', () => {
        if (!pointerLocked) {
            canvas.requestPointerLock();
        }
    });
    document.addEventListener('pointerlockchange', () => {
        pointerLocked = document.pointerLockElement === canvas;
    });
    document.addEventListener('mousemove', (e) => {
        if (!pointerLocked) return;
        cameraYaw   -= e.movementX * mouseSensitivity;
        cameraPitch -= e.movementY * mouseSensitivity;
        // Limita o pitch para não virar a câmera de cabeça para baixo
        const maxPitch = Math.PI / 2 - 0.15;
        cameraPitch = Math.max(-maxPitch, Math.min(maxPitch, cameraPitch));
    });

    /* =====================================================================
       7. MECÂNICA DE HABILIDADE: PROJÉTIL "PODER" NO CLIQUE ESQUERDO
       [SUBSTITUIÇÃO FUTURA] Troque o projétil por um modelo .glb de bola
       de fogo / raio e adicione animações/partículas.
       ===================================================================== */
    const projeteis = [];   // array de projéteis ativos

    function dispararPoder() {
        // Material brilhante (MeshBasicMaterial) + PointLight
        const projMat = new THREE.MeshBasicMaterial({ color: 0x00E5FF });
        const projGeo = new THREE.SphereGeometry(0.55, 16, 16);
        const proj = new THREE.Mesh(projGeo, projMat);
        proj.castShadow = false;    // MeshBasicMaterial não recebe sombra, mas ok

        // Ponto de origem: na frente e na altura do peito do jogador
        const origem = new THREE.Vector3(0, 1.8, 0);
        origem.applyMatrix4(player.matrixWorld);
        proj.position.copy(origem);

        // Luz pontual no projétil
        const luz = new THREE.PointLight(0x00E5FF, 2.5, 12);
        proj.add(luz);

        // Direção: para onde o jogador está olhando (mesma direção da câmera
        // projetada no plano horizontal, com leve ajuste vertical)
        const dirCamera = new THREE.Vector3();
        camera.getWorldDirection(dirCamera);
        dirCamera.y = 0.05; // leve inclinação para cima, estilo "poder"
        dirCamera.normalize();

        // Velocidade do projétil
        const velocidade = 38;
        proj.userData.velocidade = dirCamera.clone().multiplyScalar(velocidade);
        proj.userData.tempoVida = 3.0;   // segundos

        scene.add(proj);
        projeteis.push(proj);
    }

    // Listener de clique esquerdo (quando o mouse está travado)
    document.addEventListener('mousedown', (e) => {
        if (e.button === 0 && pointerLocked) {
            dispararPoder();
        }
    });

    /* =====================================================================
       8. SISTEMA DE COLISÃO SIMPLES (AABB / distância)
       Para simplificar, consideramos o jogador como uma esfera/capsula
       e checamos colisão com blocos da ilha (caixas) e com o chão.
       ===================================================================== */

    // Lista de "caixas de colisão" do mundo. Cada entrada é um Box3.
    // Reunimos os objetos que o jogador deve colidir.
    const colisores = [];

    function registrarColisor(mesh) {
        // Atualiza a matrixWorld para garantir posição correta
        mesh.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(mesh);
        colisores.push(box);
    }

    // Registra a base da ilha, as colinas, pedras e troncos de árvores
    registrarColisor(baseIlha);
    colinasMeshes.forEach(registrarColisor);
    pedrasMeshes.forEach(registrarColisor);

    // Para as árvores, registramos apenas o tronco (para não colidir com folhas)
    ilhaGroup.children.forEach((child) => {
        if (child.isGroup) {
            // É uma árvore: o primeiro filho é o tronco
            const troncoMesh = child.children[0];
            if (troncoMesh) {
                // Ajusta para a posição global
                const box = new THREE.Box3().setFromObject(troncoMesh);
                colisores.push(box);
            }
        }
    });

    // Verifica colisão do jogador (como um ponto com raio) contra as caixas
    // Retorna um vetor de "empurrão" para resolver a colisão.
    function resolverColisoes(posicao, raio) {
        const empurrao = new THREE.Vector3();
        const playerBox = new THREE.Box3(
            new THREE.Vector3(posicao.x - raio, posicao.y, posicao.z - raio),
            new THREE.Vector3(posicao.x + raio, posicao.y + playerState.height, posicao.z + raio)
        );

        for (const box of colisores) {
            if (playerBox.intersectsBox(box)) {
                // Calcula sobreposição em cada eixo
                const overlapX = Math.min(playerBox.max.x, box.max.x) - Math.max(playerBox.min.x, box.min.x);
                const overlapY = Math.min(playerBox.max.y, box.max.y) - Math.max(playerBox.min.y, box.min.y);
                const overlapZ = Math.min(playerBox.max.z, box.max.z) - Math.max(playerBox.min.z, box.min.z);

                // Empurra pelo eixo de menor sobreposição
                if (overlapX < overlapY && overlapX < overlapZ) {
                    const dir = (posicao.x < box.getCenter(new THREE.Vector3()).x) ? -1 : 1;
                    empurrao.x += dir * overlapX;
                } else if (overlapZ < overlapY) {
                    const dir = (posicao.z < box.getCenter(new THREE.Vector3()).z) ? -1 : 1;
                    empurrao.z += dir * overlapZ;
                } else {
                    // Colisão vertical: se estiver caindo em cima do bloco, sobe
                    if (posicao.y + 0.1 < box.max.y && playerState.velocity.y <= 0) {
                        empurrao.y += overlapY;
                        playerState.onGround = true;
                        playerState.velocity.y = 0;
                    }
                }
            }
        }
        return empurrao;
    }

    /* =====================================================================
       9. LOOP DE ANIMAÇÃO PRINCIPAL
       ===================================================================== */
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05); // limita delta para estabilidade

        /* ---------- 9.1 Movimento do jogador (relativo à câmera) ---------- */
        // Direção frontal da câmera no plano XZ
        const frente = new THREE.Vector3();
        camera.getWorldDirection(frente);
        frente.y = 0;
        frente.normalize();

        const direita = new THREE.Vector3().crossVectors(frente, new THREE.Vector3(0, 1, 0)).normalize();

        // Vetor de movimento desejado
        const movimento = new THREE.Vector3();
        if (keys.w) movimento.add(frente);
        if (keys.s) movimento.sub(frente);
        if (keys.d) movimento.add(direita);
        if (keys.a) movimento.sub(direita);

        if (movimento.lengthSq() > 0) {
            movimento.normalize();
            // Rotaciona o avatar para "olhar" na direção do movimento
            const angulo = Math.atan2(movimento.x, movimento.z);
            player.rotation.y = angulo; // suavização opcional poderia ser feita aqui
        }

        // Aplica velocidade horizontal
        const velocidadeAlvo = movimento.clone().multiplyScalar(playerState.speed);
        playerState.velocity.x = THREE.MathUtils.lerp(playerState.velocity.x, velocidadeAlvo.x, 0.25);
        playerState.velocity.z = THREE.MathUtils.lerp(playerState.velocity.z, velocidadeAlvo.z, 0.25);

        /* ---------- 9.2 Pulo e gravidade ---------- */
        if (keys.space && playerState.onGround) {
            playerState.velocity.y = playerState.jumpForce;
            playerState.onGround = false;
        }

        // Aplica gravidade
        playerState.velocity.y += playerState.gravity * delta;

        /* ---------- 9.3 Integração de posição ---------- */
        const novaPosicao = player.position.clone();
        novaPosicao.x += playerState.velocity.x * delta;
        novaPosicao.y += playerState.velocity.y * delta;
        novaPosicao.z += playerState.velocity.z * delta;

        /* ---------- 9.4 Colisão e chão ---------- */
        playerState.onGround = false;

        // Chão da ilha: y = 2.5 (topo da base). Se estiver sobre a ilha,
        // a altura mínima é 2.5. Fora da ilha, cai no oceano (y=-0.6).
        // Vamos considerar que o jogador só anda sobre a ilha (base 60x60).
        const dentroDaIlha = Math.abs(novaPosicao.x) < 30 && Math.abs(novaPosicao.z) < 30;
        const alturaChao = dentroDaIlha ? 2.5 : -0.6;

        // Resolve colisão com caixas (colinas, pedras, troncos)
        const empurrao = resolverColisoes(novaPosicao, playerState.radius);
        novaPosicao.add(empurrao);

        // Verifica chão
        if (novaPosicao.y <= alturaChao) {
            novaPosicao.y = alturaChao;
            playerState.velocity.y = 0;
            playerState.onGround = true;
        }

        // Limita o jogador ao mundo (evita cair para sempre)
        if (novaPosicao.y < -20) {
            novaPosicao.set(0, 10, 0);
            playerState.velocity.set(0, 0, 0);
        }

        player.position.copy(novaPosicao);

        /* ---------- 9.5 Atualiza a câmera em terceira pessoa ---------- */
        // Posição desejada da câmera em coordenadas esféricas ao redor do jogador
        const alvoCamera = new THREE.Vector3(
            player.position.x,
            player.position.y + 2.2,   // foca um pouco acima da base
            player.position.z
        );

        const offsetX = Math.sin(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;
        const offsetY = Math.sin(cameraPitch) * cameraDistance + 3;
        const offsetZ = Math.cos(cameraYaw) * Math.cos(cameraPitch) * cameraDistance;

        const posDesejada = new THREE.Vector3(
            alvoCamera.x + offsetX,
            alvoCamera.y + offsetY,
            alvoCamera.z + offsetZ
        );

        // Suaviza o movimento da câmera (lerp)
        camera.position.lerp(posDesejada, 0.15);
        camera.lookAt(alvoCamera);

        /* ---------- 9.6 Atualiza projéteis ---------- */
        for (let i = projeteis.length - 1; i >= 0; i--) {
            const p = projeteis[i];
            p.position.addScaledVector(p.userData.velocidade, delta);
            p.userData.tempoVida -= delta;

            // Rotação visual divertida
            p.rotation.x += delta * 8;
            p.rotation.y += delta * 6;

            // Remove após tempo de vida
            if (p.userData.tempoVida <= 0) {
                scene.remove(p);
                p.geometry.dispose();
                p.material.dispose();
                projeteis.splice(i, 1);
                continue;
            }

            // Colisão do projétil com o chão/ilha: remove se cair
            if (p.position.y < -5) {
                scene.remove(p);
                p.geometry.dispose();
                p.material.dispose();
                projeteis.splice(i, 1);
            }
        }

        /* ---------- 9.7 Renderiza ---------- */
        renderer.render(scene, camera);
    }

    /* =====================================================================
       10. AJUSTE DE TAMANHO DA JANELA
       ===================================================================== */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* =====================================================================
       11. INICIA O LOOP
       ===================================================================== */
    animate();

    </script>
</body>
</html>
